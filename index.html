<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fit the phone screen exactly, include the notch area, and block pinch-zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3b2a20">
  <title>Coffee Shop Tycoon</title>
  <!-- Phone install ("Add to Home Screen"): name, icon, fullscreen, landscape.
       Only works when the page comes from https:// (ignored from a file). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Café">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The game world is drawn on this canvas -->
  <canvas id="game"></canvas>

  <!-- HUD: plain HTML laid over the canvas -->
  <div id="hud">
    <div id="money">
      <div id="cash">☕ 0</div>
      <div id="cozy"></div>
    </div>
    <div id="buttons">
      <button id="mute-btn" aria-label="Sound on or off">🔊</button>
      <button id="settings-btn" aria-label="Settings">⚙</button>
    </div>
    <!-- "What to do next" tip for new players -->
    <div id="hint"></div>
    <!-- Big celebration banner ("Bakery Corner is open!") -->
    <div id="banner">
      <div id="banner-title"></div>
      <div id="banner-text"></div>
    </div>
  </div>

  <!-- Settings panel (opened with the ⚙ button; the game pauses) -->
  <div id="settings" hidden>
    <div class="panel">
      <h2>Your café</h2>
      <!-- Two columns side by side in landscape: stats | switches and buttons -->
      <div class="panel-cols">
      <ul id="stats"></ul>
      <div>
      <!-- On/off switches (filled in by game.js) -->
      <div id="toggles"></div>
      <!-- Testing only: shown when the page is opened as index.html?cheat -->
      <div id="cheats" hidden>
        <p class="cheat-title">🧪 Testing: add money</p>
        <div class="row" id="cheat-buttons"></div>
      </div>
      <div id="reset-ask">
        <button id="reset-btn" class="btn btn-soft">Reset progress</button>
      </div>
      <div id="reset-confirm" hidden>
        <p>Start over with an empty café? Everything you built and earned will be gone. This can't be undone.</p>
        <div class="row">
          <button id="reset-no" class="btn">Keep playing</button>
          <button id="reset-yes" class="btn btn-danger">Yes, start over</button>
        </div>
      </div>
      </div>
      </div>
      <button id="settings-close" class="btn btn-main">Back to the café</button>
    </div>
  </div>

  <!-- Shown instead of the game when the phone is held upright -->
  <div id="rotate">
    <div class="rotate-icon">↻</div>
    <p>Rotate your phone</p>
    <p class="small">The café is best enjoyed sideways ☕</p>
  </div>

  <!-- Classic scripts; config.js must load first -->
  <script src="config.js"></script>
  <script src="world.js"></script>
  <script src="path.js"></script>
  <script src="customers.js"></script>
  <script src="helpers.js"></script>
  <script src="save.js"></script>
  <script src="render.js"></script>
  <script src="art.js"></script>
  <script src="input.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
