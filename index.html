<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fit the phone screen exactly, include the notch area, and block pinch-zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3b2a20">
  <title>Coffee Shop Tycoon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The game world is drawn on this canvas -->
  <canvas id="game"></canvas>

  <!-- HUD: plain HTML laid over the canvas -->
  <div id="hud">
    <div id="money">
      <div id="cash">☕ 0</div>
      <div id="income">+0/s</div>
    </div>
    <!-- Settings does nothing yet; it gets a menu in a later part -->
    <button id="settings-btn" aria-label="Settings">⚙</button>
  </div>

  <!-- Shown instead of the game when the phone is held upright -->
  <div id="rotate">
    <div class="rotate-icon">↻</div>
    <p>Rotate your phone</p>
    <p class="small">The café is best enjoyed sideways ☕</p>
  </div>

  <!-- Classic scripts; config.js must load first -->
  <script src="config.js"></script>
  <script src="world.js"></script>
  <script src="render.js"></script>
  <script src="input.js"></script>
  <script src="game.js"></script>
</body>
</html>
